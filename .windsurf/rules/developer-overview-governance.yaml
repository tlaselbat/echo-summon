# Developer Overview governance rule
apiVersion: cascade.windsurf.dev/v1
kind: Rule
metadata:
  name: developer-overview-governance
  description: >
    docs/DeveloperOverview.md describes the current state of the mod.
    Any change to the project (code/assets/data/build files) must be noted there
    in the same change request (commit/PR).
  enabled: false  # superseded by roadmap-governance.yaml
spec:
  trigger:
    events:
      - change.requested
      - pr.opened
      - pr.synchronize
  conditions:
    watchGlobs:
      - src/**
      - assets/**
      - data/**
      - build.gradle*
      - gradle/**
  action:
    type: content_change_review
    target:
      repo: .
    validationPolicy:
      requireCompanionChange:
        whenAnyChangedMatchGlobs:
          - src/**
          - assets/**
          - data/**
          - build.gradle*
          - gradle/**
        companionFile: docs/DeveloperOverview.md
      onFail:
        block: true
        message: >
          This change modifies project files but did not update docs/DeveloperOverview.md.
          Update the document to reflect the current state.