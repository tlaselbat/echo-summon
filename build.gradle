// (Removed malformed nested jar/compileJava block)

//// Configure the publishing settings
//publishing {
//	// Create a Maven publication for the mod

// Validation: ensure equipment JSONs and textures stay in sync
tasks.register("validateEquipmentAssets") {
    group = "verification"
    description = "Validates equipment asset JSONs and textures alignment."
    doLast {
        def ns = "echo_summon"
        def projectDirFile = project.projectDir
        def resDir = new File(projectDirFile, "src/main/resources/assets/${ns}")
        def equipmentDir = new File(resDir, "equipment")
        def texturesBase = new File(resDir, "textures/entity/equipment")
        def modAssetsFile = new File(projectDirFile, "src/main/java/com/tabletmc/echo_summon/item/equipment/ModEquipmentAssets.java")
        def issues = []

        if (!equipmentDir.exists()) {
            throw new GradleException("Missing equipment directory: ${equipmentDir}")
        }

        // 1) JSON -> PNG validation
        equipmentDir.eachFileRecurse { f ->
            if (f.name.endsWith('.json')) {
                def json
                try {
                    json = new groovy.json.JsonSlurper().parseText(f.text)
                } catch (Throwable t) {
                    issues << "Invalid JSON: ${f} (${t.message})"
                    return
                }
                def layersObj = json.layers
                if (!(layersObj instanceof Map) || layersObj.isEmpty()) {
                    issues << "No 'layers' in ${f}"
                    return
                }
                layersObj.each { layerType, arr ->
                    if (!(arr instanceof List) || arr.isEmpty()) {
                        issues << "Empty layer array for ${layerType} in ${f}"
                        return
                    }
                    def tex = arr[0]?.texture
                    if (!(tex instanceof String) || !tex.contains(':')) {
                        issues << "Bad texture '${tex}' in ${f}"
                        return
                    }
                    def parts = tex.split(':', 2)
                    def texNs = parts[0]; def baseName = parts[1]
                    if (texNs != ns) {
                        issues << "Unexpected namespace '${texNs}' in ${f}"
                    }
                    def png = new File(texturesBase, "${layerType}/${baseName}.png")
                    if (!png.exists()) {
                        issues << "Missing texture: ${png} (from ${f}, layer ${layerType}, texture ${tex})"
                    }
                }
            }
        }

        // 2) Code register() -> JSON exists
        if (modAssetsFile.exists()) {
            def code = modAssetsFile.text
            def matcher = (code =~ /register\(\s*EquipmentModel\.LayerType\.[A-Z_]+\s*,\s*\"([^\"]+)\"\s*\)/)
            matcher.each { m ->
                def path = m[1]
                def jsonFile = new File(equipmentDir, "${path}.json")
                if (!jsonFile.exists()) {
                    issues << "Missing equipment JSON for registered asset '${path}': ${jsonFile}"
                }
            }
        }

        if (!issues.isEmpty()) {
            issues.each { println it }
            throw new GradleException("Equipment validation failed with ${issues.size()} issue(s).")
        } else {
            println "Equipment assets validation passed."
        }
    }
}
